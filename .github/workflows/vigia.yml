name: Vigia Radar Trip

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rodar o vigia
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python vigia.py

      - name: Guardar o que foi visto
        run: |
          git config user.name "radartrip-bot"
          git config user.email "radartrip-bot@users.noreply.github.com"
          git add dados
          if git diff --cached --quiet; then
            echo "Nada novo para guardar."
          else
            git commit -m "Vigia: atualiza dados"
            git pull --rebase
            git push
          fi
